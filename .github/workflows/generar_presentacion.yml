name: Generar PowerPoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentacion/generar_presentacion.py'
      - '.github/workflows/generar_presentacion.yml'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install python-pptx

      - name: Generar presentación
        run: python presentacion/generar_presentacion.py

      - name: Guardar PowerPoint en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentacion/Del_Acero_al_Algoritmo_FINAL_MORPH.pptx
          if git diff --cached --quiet; then
            echo 'La presentación ya está actualizada.'
          else
            git commit -m 'build: generar PowerPoint Del acero al algoritmo'
            git push
          fi
