name: Generar PowerPoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentacion/generar_presentacion.js'
      - '.github/workflows/generar_presentacion.yml'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar PptxGenJS
        run: npm install pptxgenjs@4.0.0

      - name: Generar presentación
        run: node presentacion/generar_presentacion.js

      - name: Guardar PowerPoint en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentacion/El_Precio_de_Elegir_en_Biobio.pptx
          if git diff --cached --quiet; then
            echo 'La presentación ya está actualizada.'
          else
            git commit -m 'build: generar PowerPoint final'
            git push
          fi
