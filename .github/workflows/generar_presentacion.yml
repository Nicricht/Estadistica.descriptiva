name: Generar PowerPoint

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentacion/generar_presentacion.py'
      - 'presentacion/ppt_assets.py'
      - 'presentacion/ppt_deck.py'
      - 'presentacion/slides_a.py'
      - 'presentacion/slides_b.py'
      - '.github/workflows/generar_presentacion.yml'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install python-pptx pillow

      - name: Generar presentación
        run: python presentacion/generar_presentacion.py

      - name: Validar estructura del PowerPoint
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          p=Path('presentacion/Del_Acero_al_Algoritmo_FINAL_MORPH.pptx')
          assert p.exists() and p.stat().st_size > 100000
          with zipfile.ZipFile(p) as z:
              slides=[n for n in z.namelist() if n.startswith('ppt/slides/slide') and n.endswith('.xml')]
              morph=sum(b'p159:morph' in z.read(n) for n in slides)
          assert len(slides)==20, len(slides)
          assert morph==19, morph
          print('PowerPoint validado:', len(slides), 'slides,', morph, 'Morph')
          PY

      - name: Guardar PowerPoint en el repositorio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentacion/Del_Acero_al_Algoritmo_FINAL_MORPH.pptx
          if git diff --cached --quiet; then
            echo 'La presentación ya está actualizada.'
          else
            git commit -m 'build: generar PowerPoint auditado Del acero al algoritmo'
            git push
          fi
