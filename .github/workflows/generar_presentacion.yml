name: Generar PowerPoint Estilo Profesor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentacion/generar_presentacion_profesor.py'
      - 'scripts/alinear_presentacion_rubrica.py'
      - 'scripts/agregar_clasificacion_variables.py'
      - '.github/workflows/generar_presentacion.yml'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install python-pptx

      - name: Alinear notebook y presentación con la pauta
        run: python scripts/alinear_presentacion_rubrica.py

      - name: Agregar clasificación de variables
        run: python scripts/agregar_clasificacion_variables.py

      - name: Generar presentación oficial
        run: python presentacion/generar_presentacion_profesor.py

      - name: Validar PowerPoint
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import zipfile

          p = Path('presentacion/Del_Acero_al_Algoritmo_Estilo_Profesor.pptx')
          assert p.exists() and p.stat().st_size > 50000
          with zipfile.ZipFile(p) as z:
              slides = sorted(
                  n for n in z.namelist()
                  if n.startswith('ppt/slides/slide') and n.endswith('.xml')
              )
              assert len(slides) == 18, len(slides)
              texto = '\n'.join(z.read(n).decode('utf-8') for n in slides)

          for esperado in [
              '4.106.400', '20,15%', '6,92%', '128', 'quantile(0.90)',
              '73 CRUCH', '55 privadas', 'cumsum()', '0 duplicados completos',
              'barras y subplots', 'Para operacionalizar “sustantivamente más caro”',
              'CRITERIO Y RESPUESTA', 'EXPLICACIÓN ENCONTRADA',
              'ANEXO · Clasificación de variables', 'VARIABLES CUALITATIVAS',
              'VARIABLES CUANTITATIVAS', 'Nominal', 'Ordinal', 'Discreta', 'Continua'
          ]:
              assert esperado in texto, esperado

          for prohibido in [
              'Q3 + 1,5 × RIC', 'Rango intercuartílico', 'var()', '10,6%',
              'circular, histogramas, scatter'
          ]:
              assert prohibido not in texto, prohibido

          print('PowerPoint validado:', len(slides), 'diapositivas')
          PY

      - name: Validar notebook contra la pauta
        shell: bash
        run: |
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('notebooks/Estadistica_Descriptiva_Biobio.ipynb')
          nb = json.loads(p.read_text(encoding='utf-8'))
          texto = '\n'.join(''.join(c.get('source', [])) for c in nb.get('cells', []))
          assert '**Criterio diseñado:**' in texto
          assert '**Explicación encontrada:**' in texto
          assert 'no demuestran que estas variables sean la causa directa del precio' in texto
          assert '## 1.1 Clasificación de las variables principales' in texto
          assert '| GÉNERO | Cualitativa | Nominal |' in texto
          assert '| RANGO EDAD | Cualitativa | Ordinal |' in texto
          assert '| AÑO INGRESO | Cuantitativa | Discreta |' in texto
          assert '| EDAD | Cuantitativa | Continua |' in texto
          assert '| VALOR ARANCEL (PESOS) | Cuantitativa | Continua |' in texto
          print('Notebook alineado con la pauta y con clasificación de variables.')
          PY

      - name: Guardar notebook y presentación oficiales
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            notebooks/Estadistica_Descriptiva_Biobio.ipynb \
            presentacion/generar_presentacion_profesor.py \
            presentacion/Del_Acero_al_Algoritmo_Estilo_Profesor.pptx
          if git diff --cached --quiet; then
            echo 'El notebook y la presentación oficial ya están actualizados.'
          else
            git commit -m 'build: agregar clasificación de variables'
            git pull --rebase origin main
            git push origin main
          fi
