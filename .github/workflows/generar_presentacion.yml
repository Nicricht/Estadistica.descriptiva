name: Generar PowerPoint Estilo Profesor

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'presentacion/generar_presentacion_profesor.py'
      - 'scripts/alinear_presentacion_rubrica.py'
      - '.github/workflows/generar_presentacion.yml'

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install python-pptx

      - name: Alinear presentación con rúbrica
        run: python scripts/alinear_presentacion_rubrica.py

      - name: Generar presentación oficial
        run: python presentacion/generar_presentacion_profesor.py

      - name: Validar PowerPoint
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import zipfile

          p = Path('presentacion/Del_Acero_al_Algoritmo_Estilo_Profesor.pptx')
          assert p.exists() and p.stat().st_size > 50000
          with zipfile.ZipFile(p) as z:
              slides = sorted(
                  n for n in z.namelist()
                  if n.startswith('ppt/slides/slide') and n.endswith('.xml')
              )
              assert len(slides) == 17, len(slides)
              texto = '\n'.join(z.read(n).decode('utf-8') for n in slides)

          for esperado in [
              '4.106.400', '20,15%', '6,92%', '128', 'quantile(0.90)',
              '73 CRUCH', '55 privadas', 'cumsum()', '0 duplicados completos',
              'barras y subplots', 'Para operacionalizar “sustantivamente más caro”'
          ]:
              assert esperado in texto, esperado

          for prohibido in [
              'Q3 + 1,5 × RIC', 'Rango intercuartílico', 'var()', '10,6%',
              'circular, histogramas, scatter'
          ]:
              assert prohibido not in texto, prohibido

          print('PowerPoint validado:', len(slides), 'diapositivas')
          PY

      - name: Guardar presentación oficial
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentacion/generar_presentacion_profesor.py presentacion/Del_Acero_al_Algoritmo_Estilo_Profesor.pptx
          if git diff --cached --quiet; then
            echo 'La presentación oficial ya está actualizada.'
          else
            git commit -m 'build: alinear PowerPoint con rúbrica y notebook'
            git pull --rebase origin main
            git push origin main
          fi
