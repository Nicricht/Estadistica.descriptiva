name: Publicar PowerPoint Estilo Profesor

on:
  push:
    branches: [main]
    paths:
      - 'presentacion/_ppt_chunks/official_revised.b64'
      - '.github/workflows/subir_ppt_auditado.yml'

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruir PowerPoint oficial
        shell: bash
        run: |
          set -e
          base64 -d presentacion/_ppt_chunks/official_revised.b64 > presentacion/Del_Acero_al_Algoritmo_Estilo_Profesor.pptx
          unzip -t presentacion/Del_Acero_al_Algoritmo_Estilo_Profesor.pptx > /dev/null
          test "$(stat -c%s presentacion/Del_Acero_al_Algoritmo_Estilo_Profesor.pptx)" -eq 72328

      - name: Guardar presentación oficial
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add presentacion/Del_Acero_al_Algoritmo_Estilo_Profesor.pptx
          if git diff --cached --quiet; then
            echo 'El PowerPoint oficial ya coincide con la versión revisada.'
          else
            git commit -m 'build: publicar PowerPoint Estilo Profesor entendible'
            git pull --rebase origin main
            git push origin main
          fi
